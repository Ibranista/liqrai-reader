document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

both\">Deepens focus<\u002Fspan>\n      <span style=\"border:1px solid rgba(246,243,238,.16);border-radius:20px;padding:8px 16px;font:500 14px 'Hanken Grotesk',sans-serif;color:#B8AE9F;animation:spUp .45s .95s both\">Strengthens memory<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"font:400 12.5px 'Hanken Grotesk',sans-serif;color:#7A7062;animation:spUp .45s 1.4s both\">Tap anywhere to continue<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- NAV -->\n<div style=\"position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(251,248,243,.94);border-bottom:1px solid rgba(32,27,21,.08);transform:translateY({{ navShift }});transition:transform .32s ease\" data-screen-label=\"Nav\">\n  <div style=\"max-width:1140px;margin:0 auto;min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:10px 24px\">\n    <a href=\"#top\" style=\"display:flex;align-items:center;gap:10px;color:#201B15\">\n      <span style=\"width:32px;height:32px;border-radius:10px;background:#201B15;display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 44 44\"><rect x=\"10\" y=\"6\" width=\"9\" height=\"30\" rx=\"2\" fill=\"#FDFBF8\"><\u002Frect><rect x=\"10\" y=\"29\" width=\"24\" height=\"9\" rx=\"2\" fill=\"#5FA96D\"><\u002Frect><circle cx=\"33\" cy=\"12\" r=\"4\" fill=\"#5FA96D\"><\u002Fcircle><\u002Fsvg><\u002Fspan>\n      <span style=\"font:600 18px 'Literata',serif;letter-spacing:-0.01em\">Liqrai Reader<\u002Fspan>\n    <\u002Fa>\n    <div style=\"display:flex;align-items:center;gap:clamp(14px,2.4vw,28px);flex-wrap:wrap;font:500 14px 'Hanken Grotesk',sans-serif\">\n      <a href=\"#features\" style=\"color:#201B15\" style-hover=\"color:#3C7546\">Features<\u002Fa>\n      <a href=\"#why\" style=\"color:#201B15\" style-hover=\"color:#3C7546\">Why read<\u002Fa>\n      <a href=\"#pro\" style=\"color:#201B15\" style-hover=\"color:#3C7546\">Pro<\u002Fa>\n      <a href=\"#pricing\" style=\"color:#201B15\" style-hover=\"color:#3C7546\">Pricing<\u002Fa>\n      <a href=\"#contact\" style=\"color:#201B15\" style-hover=\"color:#3C7546\">Contact<\u002Fa>\n      <a href=\"#pricing\" style=\"background:#201B15;color:#F6F3EE;border-radius:12px;padding:10px 18px;font:600 14px 'Hanken Grotesk',sans-serif\" style-hover=\"background:#3A322A;color:#F6F3EE\">Get Liqrai Reader free<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- spacer for fixed nav -->\n<div style=\"height:66px\"><\u002Fdiv>\n\n<!-- FLOATING CTA (appears when nav is hidden) -->\n<a href=\"#pricing\" style=\"position:fixed;right:22px;bottom:22px;z-index:60;display:flex;align-items:center;gap:10px;background:#201B15;color:#F6F3EE;border-radius:16px;padding:15px 22px;font:600 14.5px 'Hanken Grotesk',sans-serif;box-shadow:0 14px 36px rgba(32,27,21,.3);opacity:{{ fabOpacity }};transform:translateY({{ fabShift }});pointer-events:{{ fabPointer }};transition:opacity .3s ease,transform .3s ease\" style-hover=\"background:#3A322A;color:#F6F3EE\" data-screen-label=\"Floating CTA\">\n  <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 44 44\"><rect x=\"10\" y=\"6\" width=\"9\" height=\"30\" rx=\"2\" fill=\"#FDFBF8\"><\u002Frect><rect x=\"10\" y=\"29\" width=\"24\" height=\"9\" rx=\"2\" fill=\"#5FA96D\"><\u002Frect><circle cx=\"33\" cy=\"12\" r=\"4\" fill=\"#5FA96D\"><\u002Fcircle><\u002Fsvg>\n  Get Liqrai Reader free\n<\u002Fa>\n\n<!-- HERO -->\n<div id=\"top\" style=\"max-width:1140px;margin:0 auto;padding:clamp(48px,7vw,88px) 24px clamp(56px,8vw,96px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:clamp(36px,6vw,72px);align-items:center\" data-screen-label=\"Hero\">\n  <div style=\"display:flex;flex-direction:column;gap:22px\">\n    <div style=\"display:flex\"><span style=\"border:1px solid rgba(32,27,21,.15);border-radius:20px;padding:6px 14px;font:500 12.5px 'Hanken Grotesk',sans-serif;color:#7A7062\">A calmer PDF reader<\u002Fspan><\u002Fdiv>\n    <h1 style=\"margin:0;font:700 clamp(36px,5vw,56px)/1.12 'Hanken Grotesk',sans-serif;letter-spacing:-0.02em;text-wrap:pretty\">Read deeper.<br>Remember more.<\u002Fh1>\n    <p style=\"margin:0;max-width:460px;font:400 17px/1.6 'Hanken Grotesk',sans-serif;color:#5C5548;text-wrap:pretty\">Liqrai Reader is a focused reading space for textbooks, papers and reports — with an AI companion that explains, summarizes and helps you remember what you read.<\u002Fp>\n    <div style=\"display:flex;gap:12px;align-items:center;margin-top:6px\">\n      <a href=\"#pricing\" style=\"background:#201B15;color:#F6F3EE;border-radius:14px;padding:15px 26px;font:600 15px 'Hanken Grotesk',sans-serif\" style-hover=\"background:#3A322A;color:#F6F3EE\">Download free<\u002Fa>\n      <a href=\"#pricing\" style=\"border:1.5px solid rgba(32,27,21,.18);color:#201B15;border-radius:14px;padding:14px 24px;font:600 15px 'Hanken Grotesk',sans-serif\" style-hover=\"border-color:#201B15;color:#201B15\">See Pro pricing<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"font:400 13px 'Hanken Grotesk',sans-serif;color:#7A7062\">Reading is free forever · AI companion included in Pro<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"background:#fff;border:1px solid rgba(32,27,21,.09);border-radius:22px;box-shadow:0 24px 60px rgba(32,27,21,.1);overflow:hidden\">\n    <div style=\"display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid rgba(32,27,21,.07)\">\n      <div style=\"flex:1;min-width:0\"><div style=\"font:600 14px 'Hanken Grotesk',sans-serif\">Deep Learning Foundations<\u002Fdiv><div style=\"font:400 11.5px 'Hanken Grotesk',sans-serif;color:#7A7062\">Ch. 4 — Neural Networks · Page 42 of 310<\u002Fdiv><\u002Fdiv>\n      <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 20 20\" fill=\"#5FA96D\" stroke=\"#5FA96D\" stroke-width=\"1.6\" stroke-linejoin=\"round\"><path d=\"M6 3h8v14l-4-3-4 3Z\"><\u002Fpath><\u002Fsvg>\n    <\u002Fdiv>\n    <div style=\"padding:26px 30px 8px\">\n      <p style=\"margin:0 0 16px;font:400 15.5px/1.75 'Literata',serif;color:#2A241C;text-wrap:pretty\">Backpropagation is, at its core, an application of the chain rule. <span style=\"background:#FDE68A;border-radius:3px;padding:1px 2px\">The error observed at the output layer is passed backwards through the network<\u002Fspan>, and each weight is adjusted in proportion to its contribution.<\u002Fp>\n      <p style=\"margin:0;font:400 15.5px/1.75 'Literata',serif;color:#2A241C;text-wrap:pretty\">What makes this remarkable is not the mathematics but the economy: a single backward pass prices every parameter in the network.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"padding:18px 20px 22px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"align-self:flex-end;display:flex;align-items:center;gap:8px;background:#201B15;color:#F6F3EE;border-radius:22px;padding:11px 18px;font:600 13.5px 'Hanken Grotesk',sans-serif;box-shadow:0 8px 20px rgba(32,27,21,.22)\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5FA96D\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 18v-5.25m0 0a6.01 6.01 0 001.5-.189m-1.5.189a6.01 6.01 0 01-1.5-.189m3.75 7.478a12.06 12.06 0 01-4.5 0m3.75 2.383a14.406 14.406 0 01-3 0M14.25 18v-.192c0-.983.658-1.823 1.508-2.316a7.5 7.5 0 10-7.517 0c.85.493 1.509 1.333 1.509 2.316V18\"><\u002Fpath><\u002Fsvg>Explain this<\u002Fdiv>\n      <div style=\"background:#F1F8F2;border-radius:14px;padding:14px 16px\">\n        <div style=\"font:600 10.5px 'Hanken Grotesk',sans-serif;color:#3C7546;text-transform:uppercase;letter-spacing:.07em\">In plain words<\u002Fdiv>\n        <div style=\"font:400 13.5px/1.55 'Hanken Grotesk',sans-serif;color:#2A241C;margin-top:5px\">The network checks how wrong its answer was, then walks that mistake backwards so every connection learns how much it was to blame.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- FEATURES -->\n<div id=\"features\" style=\"background:#F3EEE6;border-top:1px solid rgba(32,27,21,.06);border-bottom:1px solid rgba(32,27,21,.06)\" data-screen-label=\"Features\">\n  <div style=\"max-width:1140px;margin:0 auto;padding:clamp(56px,8vw,88px) 24px\">\n    <div style=\"max-width:560px\">\n      <h2 style=\"margin:0;font:700 clamp(28px,3.4vw,36px)/1.2 'Hanken Grotesk',sans-serif;letter-spacing:-0.015em\">Everything reading needs, free<\u002Fh2>\n      <p style=\"margin:14px 0 0;font:400 16px/1.6 'Hanken Grotesk',sans-serif;color:#5C5548\">The reader is complete on its own — and always will be.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:20px;margin-top:48px\">\n      <div style=\"background:#fff;border:1px solid rgba(32,27,21,.07);border-radius:18px;padding:26px 24px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"width:42px;height:42px;border-radius:13px;background:#DCEEE0;display:flex;align-items:center;justify-content:center\"><svg width=\"21\" height=\"21\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3C7546\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z\"><\u002Fpath><path d=\"M15 12a3 3 0 11-6 0 3 3 0 016 0z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div style=\"font:600 16px 'Hanken Grotesk',sans-serif\">Focus mode<\u002Fdiv>\n        <div style=\"font:400 13.5px/1.55 'Hanken Grotesk',sans-serif;color:#7A7062;margin-top:-6px\">Gentle sessions that fade everything but the page you're on.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid rgba(32,27,21,.07);border-radius:18px;padding:26px 24px;display:flex;flex-direction:column;gap:14px\">\n        <div style=\"width:42px;height:42p =\"21\" height=\"21\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#3C7546\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 6.042A8.967 8.967 0 006.75 4.5a8.966 8.966 0 00-3.75.814v14.25A8.987 8.987 0 016.75 18a8.967 8.967 0 015.25 1.542 8.967 8.967 0 015.25-1.542 8.987 8.987 0 013.75.814V5.314A8.966 8.966 0 0017.25 4.5 8.967 8.967 0 0012 6.042zm0 0V19.5\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n        <div style=\"font:600 16px 'Hanken Grotesk',sans-serif\">Library &amp; collections<\u002Fdiv>\n        <div style=\"font:400 13.5px/1.55 'Hanken Grotesk',sans-serif;color:#7A7062;margin-top:-6px\">A quiet shelf for everything you're reading, sorted your way.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- WHY READ -->\n<div id=\"why\" style=\"max-width:1140px;margin:0 auto;padding:clamp(56px,8vw,96px) 24px 0\" data-screen-label=\"Why read\">\n  <div style=\"max-width:620px;display:flex;flex-direction:column;gap:16px\">\n    <div style=\"display:flex\"><span style=\"border:1px solid rgba(32,27,21,.15);border-radius:20px;padding:6px 14px;font:500 12.5px 'Hanken Grotesk',sans-serif;color:#7A7062\">Why we read<\u002Fspan><\u002Fdiv>\n    <h2 style=\"margin:0;font:700 clamp(28px,3.4vw,36px)/1.2 'Hanken Grotesk',sans-serif;letter-spacing:-0.015em;text-wrap:pretty\">Your attention is worth defending<\u002Fh2>\n    <p style=\"margin:0;font:400 16px/1.65 'Hanken Grotesk',sans-serif;color:#5C5548;text-wrap:pretty\">Feeds are engineered to fragment your focus. A page is built to hold it. Liqrai Reader exists for people who want their attention back — we're building a society that reads.<\u002Fp>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:20px;margin-top:44px\">\n    <div style=\"background:#fff;border:1px solid rgba(32,27,21,.07);border-radius:18px;padding:28px 26px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font:700 46px 'Hanken Grotesk',sans-serif;letter-spacing:-0.02em;color:#3C7546\">68%<\u002Fdiv>\n      <div style=\"font:600 15.5px 'Hanken Grotesk',sans-serif\">less stress after six minutes of reading<\u002Fdiv>\n      <div style=\"font:400 13.5px/1.55 'Hanken Grotesk',sans-serif;color:#7A7062;margin-top:-2px\">Reading quiets the body faster than music or a walk — University of Sussex<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid rgba(32,27,21,.07);border-radius:18px;padding:28px 26px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font:700 46px 'Hanken Grotesk',sans-serif;letter-spacing:-0.02em;color:#3C7546\">47 sec<\u002Fdiv>\n      <div style=\"font:600 15.5px 'Hanken Grotesk',sans-serif\">average attention on a screen before we switch<\u002Fdiv>\n      <div style=\"font:400 13.5px/1.55 'Hanken Grotesk',sans-serif;color:#7A7062;margin-top:-2px\">Deep reading is how you train it back — Dr. Gloria Mark, UC Irvine<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:#fff;border:1px solid rgba(32,27,21,.07);border-radius:18px;padding:28px 26px;display:flex;flex-direction:column;gap:10px\">\n      <div style=\"font:700 46px 'Hanken Grotesk',sans-serif;letter-spacing:-0.02em;color:#3C7546\">1 page<\u002Fdiv>\n      <div style=\"font:600 15.5px 'Hanken Grotesk',sans-serif\">at a time is all it takes<\u002Fdiv>\n      <div style=\"font:400 13.5px/1.55 'Hanken Grotesk',sans-serif;color:#7A7062;margin-top:-2px\">Focus is a muscle — every sustained page is a rep, and it compounds<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:1px;background:rgba(32,27,21,.09);border:1px solid rgba(32,27,21,.09);border-radius:18px;overflow:hidden;margin-top:20px\">\n    <div style=\"background:#F3EEE6;padding:26px 28px;display:flex;flex-direction:column;gap:8px\">\n      <div style=\"font:600 11.5px 'Hanken Grotesk',sans-serif;color:#7
